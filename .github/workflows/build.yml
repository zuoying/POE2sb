name: Build Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Set up Pico SDK
      run: |
        git clone --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init --recursive
        echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -G Ninja \
          -DPICO_PLATFORM=rp2040 \
          -DPICO_BOARD=adafruit_feather_rp2040 \
          -DPICO_SDK_PATH=$PICO_SDK_PATH \
          -DCMAKE_BUILD_TYPE=Release \
          -DCFG_TUH_RPI_PIO_USB=1 \
          -DPIO_USB_HOST_PIN_DM=27 \
          -DPIO_USB_HOST_PIN_DP=26 \
          -DPIO_USB_HOST_PIO_INST=0 \
          -DPIO_USB_HOST_SM=0 \
          ..

    - name: Build
      run: |
        cd build
        ninja

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: poe2gamepad-firmware
        path: build/*.uf2
