name: Build Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Set up Pico SDK
      run: |
        git clone --depth 1 --branch 1.5.1 https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init --recursive
        # 下载TinyUSB的PIO-USB依赖（pio_usb.h等）
        cd lib/tinyusb
        python3 tools/get_deps.py rp2040
        cd ../../..
        echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> $GITHUB_ENV
        # 验证pio_usb.h已下载
        echo "=== Verifying PIO-USB files ==="
        find lib/tinyusb -name "pio_usb.h" -type f 2>/dev/null || echo "pio_usb.h not found!"

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake -G Ninja \
          -DPICO_PLATFORM=rp2040 \
          -DPICO_BOARD=adafruit_feather_rp2040 \
          -DPICO_SDK_PATH=$PICO_SDK_PATH \
          -DCMAKE_BUILD_TYPE=Release \
          ..

    - name: Build
      run: |
        cd build
        ninja

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: poe2gamepad-firmware
        path: build/*.uf2
