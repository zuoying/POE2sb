name: Build Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Set up Pico SDK
      run: |
        git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init --recursive
        echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> $GITHUB_ENV
        # 检查PIO-USB头文件是否在SDK中
        echo "=== Checking for PIO-USB in Pico SDK ==="
        if [ -f "lib/tinyusb/hw/bsp/rp2_common/pio_usb.h" ]; then
            echo "✓ Found pio_usb.h in Pico SDK"
        else
            echo "Looking for pio_usb.h in SDK..."
            find . -name "pio_usb.h" -type f 2>/dev/null | head -10
        fi

    - name: Configure CMake (without external PIO-USB)
      run: |
        mkdir build
        cd build
        echo "Configuring CMake without external PIO-USB"
        echo "PICO_SDK_PATH=$PICO_SDK_PATH"
        # 使用简化的CMake命令，不指定外部PIO-USB路径
        cmake -G Ninja \
          -DPICO_PLATFORM=rp2350 \
          -DPICO_BOARD=pico2 \
          -DPICO_SDK_PATH=$PICO_SDK_PATH \
          -DCMAKE_BUILD_TYPE=Release \
          .. 2>&1 | tee cmake_output.log
        echo "CMake configuration complete"
        # 显示生成的包含路径
        echo "=== Generated include paths ==="
        cat cmake_output.log | grep -i "include" || true

    - name: Build
      run: |
        cd build
        ninja

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: poe2gamepad-firmware
        path: build/*.uf2
