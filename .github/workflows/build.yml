name: Build Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install ARM GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib

    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Set up Pico SDK
      run: |
        git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init --recursive
        echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk" >> $GITHUB_ENV

    - name: Set up Pico-PIO-USB
      run: |
        git clone --depth 1 --branch main https://github.com/sekigon-gonnoc/Pico-PIO-USB.git
        cd Pico-PIO-USB
        echo "PICO_PIO_USB_PATH=$(pwd)" >> $GITHUB_ENV
        echo "PICO_PIO_USB_PATH set to: $(pwd)"
        ls -la  # 显示克隆的文件
        # 验证头文件存在
        if [ -f "pio_usb.h" ]; then
            echo "✓ pio_usb.h found in Pico-PIO-USB"
        else
            echo "✗ ERROR: pio_usb.h not found in Pico-PIO-USB"
            find . -name "*.h" | head -20
        fi

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        echo "Configuring CMake with PICO_PIO_USB_PATH=$PICO_PIO_USB_PATH"
        echo "PICO_SDK_PATH=$PICO_SDK_PATH"
        # 检查PIO-USB头文件是否存在
        if [ -f "$PICO_PIO_USB_PATH/pio_usb.h" ]; then
            echo "Found pio_usb.h at: $PICO_PIO_USB_PATH/pio_usb.h"
        else
            echo "WARNING: pio_usb.h not found at $PICO_PIO_USB_PATH/"
            echo "Listing PICO_PIO_USB_PATH contents:"
            ls -la "$PICO_PIO_USB_PATH/"
            echo "Searching for pio_usb.h in subdirectories..."
            find "$PICO_PIO_USB_PATH" -name "pio_usb.h" 2>/dev/null
        fi
        cmake -G Ninja \
          -DPICO_PLATFORM=rp2350 \
          -DPICO_BOARD=pico2 \
          -DPICO_PIO_USB_PATH=$PICO_PIO_USB_PATH \
          -DPICO_SDK_PATH=$PICO_SDK_PATH \
          -DCMAKE_BUILD_TYPE=Release \
          .. 2>&1 | tee cmake_output.log
        echo "CMake configuration complete"

    - name: Build
      run: |
        cd build
        ninja

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: poe2gamepad-firmware
        path: build/*.uf2
